<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base Slots Chassis - Moving Reels</title>
    <style>
        body {
            background-color: #222;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .game-container {
            text-align: center;
            background-color: #333;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        canvas {
            background-color: #111;
            border: 2px solid #555;
            display: block;
            margin: 0 auto 20px auto;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            align-items: center;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background-color: #ff9900;
            border: none;
            border-radius: 5px;
            color: #000;
        }

        button:disabled {
            background-color: #555;
            color: #888;
            cursor: not-allowed;
        }

        .info-panel {
            margin-bottom: 15px;
            font-size: 18px;
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="info-panel">
        Coins: <span id="balanceDisplay">1000</span> | 
        Lines: <span id="linesDisplay">20</span> | 
        Total Bet: <span id="betDisplay">20</span>
    </div>

    <!-- Canvas window optimized for 5 reels (100px width each) and 3 visible rows (100px height each) -->
    <canvas id="slotCanvas" width="500" height="300"></canvas>

    <div class="controls">
        <button id="spinBtn" onclick="slotMachine.spin()">SPIN!</button>
        <button onclick="slotMachine.addCredits()">Top-Up</button>
    </div>
</div>

<script>
class SlotMachine {
    constructor() {
        this.canvas = document.getElementById('slotCanvas');
        this.ctx = this.canvas.getContext('2d');
        
        this.config = {
            reels: 5,
            rows: 3,
            symbolWidth: 100,
            symbolHeight: 100,
            baseSpinSpeed: 25,     // How fast the symbols slide down
            spinDuration: 1500,    // Base time the reels spin before starting to lock
            staggerDelay: 300      // Delay between each reel stopping (Left to Right)
        };

        this.coins = 1000;
        this.currentBetPerLine = 1;
        this.activeLinesCount = 20;
        this.isSpinning = false;

        // Base template asset list (Ready for your real names/links later)
        this.symbols = [
            { id: 'test_symbol', name: '💎', value: 5 }
        ];

        // Core array structure managing the physical movement states of all 5 vertical strips
        this.reelsData = [];
        this.paylines = [];
        
        this.init();
    }

    init() {
        this.generatePaylines();
        
        // Construct the 5 independent vertical reel strips
        for (let r = 0; r < this.config.reels; r++) {
            this.reelsData[r] = {
                symbols: [],       // Array of symbols currently loaded on this strip
                offsetY: 0,        // Current vertical pixel scrolling position
                state: 'stopped',  // Tracking mechanical state: stopped, spinning, stopping, bouncing
                targetStop: 0,     // Pixel destination coordinate for alignment locking
                speed: 0           // Current real-time velocity
            };
            
            // Populate each reel strip with enough starting symbols to scroll through cleanly
            for (let i = 0; i < 10; i++) {
                this.reelsData[r].symbols.push(this.symbols[0]);
            }
        }
        
        this.updateUI();
        
        // Start the master high-performance canvas rendering and physics tick loop
        this.gameTick();
    }

    generatePaylines() {
        // Horizontal lines
        for (let row = 0; row < this.config.rows; row++) {
            let line = [];
            for (let reel = 0; reel < this.config.reels; reel++) {
                line.push({ reel: reel, row: row });
            }
            this.paylines.push(line);
        }
        
        // Diagonal lines
        let diag1 = [], diag2 = [];
        for (let reel = 0; reel < this.config.reels; reel++) {
            diag1.push({ reel: reel, row: Math.min(reel, this.config.rows - 1) });
            diag2.push({ reel: reel, row: Math.max(0, this.config.rows - 1 - reel) });
        }
        this.paylines.push(diag1, diag2);

        // Fill remaining spaces up to 20 system paylines
        while(this.paylines.length < 20) {
            let pseudoLine = [];
            for (let reel = 0; reel < this.config.reels; reel++) {
                pseudoLine.push({ reel: reel, row: Math.floor(Math.random() * this.config.rows) });
            }
            this.paylines.push(pseudoLine);
        }
    }

    spin() {
        let totalCost = this.currentBetPerLine * this.activeLinesCount;
        if (this.isSpinning || this.coins < totalCost) return;

        this.isSpinning = true;
        this.coins -= totalCost;
        this.updateUI();
        document.getElementById('spinBtn').disabled = true;

        let startTime = Date.now();

        // Put all 5 reels into motion simultaneously
        for (let r = 0; r < this.config.reels; r++) {
            let reel = this.reelsData[r];
            reel.state = 'spinning';
            reel.speed = this.config.baseSpinSpeed;
        }

        // Set up the staggered stop timing sequence loop
        for (let r = 0; r < this.config.reels; r++) {
            setTimeout(() => {
                let reel = this.reelsData[r];
                reel.state = 'stopping';
                // Calculate pixel alignment lock boundary based on symbol heights
                reel.targetStop = Math.ceil(reel.offsetY / this.config.symbolHeight) * this.config.symbolHeight;
            }, this.config.spinDuration + (r * this.config.staggerDelay));
        }
    }

    // High-performance continuous animation loop (Refreshes dynamically with the screen)
    gameTick() {
        this.updatePhysics();
        this.draw();
        requestAnimationFrame(() => this.gameTick());
    }

    updatePhysics() {
        let allReelsStopped = true;

        for (let r = 0; r < this.config.reels; r++) {
            let reel = this.reelsData[r];

            if (reel.state !== 'stopped') {
                allReelsStopped = false;
            }

            if (reel.state === 'spinning' || reel.state === 'stopping') {
                // Apply downward displacement velocity vector
                reel.offsetY += reel.speed;

                // Infinite loop buffer check: reset layout when a symbol slides completely off screen
                if (reel.offsetY >= this.config.symbolHeight) {
                    reel.offsetY -= this.config.symbolHeight;
                    // Pop a symbol off the bottom and insert a fresh one at the top of the strip stack
                    reel.symbols.pop();
                    let randomIdx = Math.floor(Math.random() * this.symbols.length);
                    reel.symbols.unshift(this.symbols[randomIdx]);

                    // Adjust targeting coordinates cleanly if the reel is currently entering the stopping phase
                    if (reel.state === 'stopping') {
                        reel.targetStop -= this.config.symbolHeight;
                    }
                }

                // If the stopping reel hits its exact target alignment frame, initiate the spring bounce
                if (reel.state === 'stopping' && reel.offsetY >= reel.targetStop) {
                    reel.offsetY = 0; // Lock structural alignment directly back to baseline grid array
                    reel.state = 'bouncing';
                    reel.speed = -6;  // Invert velocity upward to simulate mechanical bounce physics
                }
            } 
            else if (reel.state === 'bouncing') {
                // Execute the upward spring rebound recoil path
                reel.offsetY += reel.speed;
                reel.speed += 1.5; // Simulate gravity resistance pulling it back down to natural rest

                if (reel.offsetY >= 0) {
                    reel.offsetY = 0;
                    reel.state = 'stopped';
                    reel.speed = 0;
                }
            }
        }

        // Clean cleanup trigger check once the entire sequence reaches a synchronized stop state
        if (this.isSpinning && allReelsStopped) {
            this.isSpinning = false;
            this.checkWins();
            document.getElementById('spinBtn').disabled = false;
            this.updateUI();
        }
    }

    draw() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

        // Draw each reel row matrix tracking real-time pixel offset positions
        for (let r = 0; r < this.config.reels; r++) {
            let reel = this.reelsData[r];
            
            // Render an extra symbol padding element above and below viewport borders to prevent edge clipping gaps
            for (let i = -1; i < this.config.rows + 1; i++) {
                let symbol = reel.symbols[i + 1] || this.symbols[0];
                let x = r * this.config.symbolWidth;
                // Base Y math grid coordinate modified by the live scrolling physics tracking value
                let y = i * this.config.symbolHeight + reel.offsetY;

                this.ctx.save();
                
                // --- PIECE #1 MOTION BLUR EFFECT ---
                // If the reel is spinning fast, apply a visual vertical smear to mimic real machine glass optics
                if (reel.state === 'spinning' && Math.abs(reel.speed) > 10) {
                    this.ctx.globalAlpha = 0.4;
                    this.ctx.font = '34px sans-serif';
                    this.ctx.fillText(symbol.name, x + this.config.symbolWidth / 2, y + this.config.symbolHeight / 2 - 10);
                    this.ctx.fillText(symbol.name, x + this.config.symbolWidth / 2, y + this.config.symbolHeight / 2 + 10);
                    this.ctx.globalAlpha = 1.0;
                }

                // Render primary base character frame cleanly centered inside cell geometry coordinates
                this.ctx.font = '34px sans-serif';
                this.ctx.textAlign = 'center';
                this.ctx.textBaseline = 'middle';
                this.ctx.fillStyle = '#fff';
                this.ctx.fillText(symbol.name, x + this.config.symbolWidth / 2, y + this.config.symbolHeight / 2);
                
                // Draw rigid frame dividing cells outer boundaries
                this.ctx.strokeStyle = '#444';
                this.ctx.strokeRect(x, y, this.config.symbolWidth, this.config.symbolHeight);
                
                this.ctx.restore();
            }
        }
    }

    checkWins() {
        let totalWin = 0;
        
        for (let i = 0; i < this.activeLinesCount; i++) {
            let line = this.paylines[i];
            // Read index mappings off the visible 3 rows currently sitting locked inside the viewport view
            let firstSymbol = this.reelsData[line[0].reel].symbols[line[0].row + 1];
            let matchCount = 1;

            for (let c = 1; c < line.length; c++) {
                let currentSymbol = this.reelsData[line[c].reel].symbols[line[c].row + 1];
                if (currentSymbol.id === firstSymbol.id) {
                    matchCount++;
                } else {
                    break;
                }
            }

            if (matchCount >= 3) {
                totalWin += firstSymbol.value * matchCount * this.currentBetPerLine;
            }
        }

        if (totalWin > 0) {
            this.coins += totalWin;
        }
    }

    updateUI() {
        document.getElementById('balanceDisplay').innerText = this.coins;
        document.getElementById('betDisplay').innerText = this.currentBetPerLine * this.activeLinesCount;
    }

    addCredits() {
        this.coins += 500;
        this.updateUI();
    }
}

const slotMachine = new SlotMachine();
</script>

</body>
</html>
